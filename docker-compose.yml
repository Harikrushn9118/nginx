services:

  nginx:
    image: nginx:alpine
    container_name: social-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_1/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - auth-1
      - auth-2
      - user-1
      - user-2
      - post-1
      - post-2
      - post-3
      - search-1
      - search-2
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: social-frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - app-network

  # ── AUTH SERVICE (2 containers) ──
  auth-1:
    build: ./backend/auth-service
    container_name: auth-1
    environment:
      - INSTANCE_ID=1
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  auth-2:
    build: ./backend/auth-service
    container_name: auth-2
    environment:
      - INSTANCE_ID=2
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  # ── USER SERVICE (2 containers) ──
  user-1:
    build: ./backend/user-service
    container_name: user-1
    environment:
      - INSTANCE_ID=1
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  user-2:
    build: ./backend/user-service
    container_name: user-2
    environment:
      - INSTANCE_ID=2
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  # ── POST SERVICE (3 containers) ──
  post-1:
    build: ./backend/post-service
    container_name: post-1
    environment:
      - INSTANCE_ID=1
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  post-2:
    build: ./backend/post-service
    container_name: post-2
    environment:
      - INSTANCE_ID=2
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  post-3:
    build: ./backend/post-service
    container_name: post-3
    environment:
      - INSTANCE_ID=3
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  # ── SEARCH SERVICE (2 containers) ──
  search-1:
    build: ./backend/search-service
    container_name: search-1
    environment:
      - INSTANCE_ID=1
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  search-2:
    build: ./backend/search-service
    container_name: search-2
    environment:
      - INSTANCE_ID=2
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
