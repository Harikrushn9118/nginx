worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 60;
    server_tokens off;

    # ── LOGGING ──
    log_format detailed '$remote_addr - [$time_local] "$request" '
                        'status=$status bytes=$body_bytes_sent '
                        'upstream=$upstream_addr '
                        'response_time=${upstream_response_time}s';

    access_log /var/log/nginx/access.log detailed;

    # ── GZIP COMPRESSION ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── RATE LIMIT ZONES ──
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m    rate=5r/s;
    limit_req_zone $binary_remote_addr zone=user_limit:10m     rate=15r/s;
    limit_req_zone $binary_remote_addr zone=post_limit:10m     rate=20r/s;
    limit_req_zone $binary_remote_addr zone=search_limit:10m   rate=10r/s;
    limit_req_status 429;

    # ── AUTH CLUSTER (ip_hash — sticky sessions) ──
    upstream auth_cluster {
        ip_hash;
        server auth-1:3000 max_fails=3 fail_timeout=30s;
        server auth-2:3000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # ── USER CLUSTER (least_conn — fastest response) ──
    upstream user_cluster {
        least_conn;
        server user-1:3000 max_fails=3 fail_timeout=30s;
        server user-2:3000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # ── POST CLUSTER (round_robin — even distribution) ──
    upstream post_cluster {
        server post-1:3000 max_fails=3 fail_timeout=30s;
        server post-2:3000 max_fails=3 fail_timeout=30s;
        server post-3:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── SEARCH CLUSTER (least_conn — CPU-heavy work) ──
    upstream search_cluster {
        least_conn;
        server search-1:3000 max_fails=3 fail_timeout=30s;
        server search-2:3000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # HTTP → Redirect to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── FRONTEND ──
        location / {
            proxy_pass http://social-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        location = /auth/register {
            limit_req zone=register_limit burst=5 nodelay;

            proxy_pass http://auth_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /auth/login {
            limit_req zone=login_limit burst=10 nodelay;

            proxy_pass http://auth_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            limit_req zone=login_limit burst=10 nodelay;

            proxy_pass http://auth_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/users {
            limit_req zone=user_limit burst=30 nodelay;

            proxy_pass http://user_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location /api/posts {
            limit_req zone=post_limit burst=40 nodelay;

            proxy_pass http://post_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location /search/ {
            limit_req zone=search_limit burst=20 nodelay;

            proxy_pass http://search_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location ~ /\. {
            deny all;
            return 404;
        }
    }
}