name: Build, Test and Push All Services

on:
  push:
    branches:
      - main

jobs:
  build-services:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        service:
          - auth-service
          - post-service
          - user-service
          - search-service

    steps:
      - name: 📥 Get the code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔡 Convert owner name to lowercase
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🔨 Build ${{ matrix.service }} (without pushing)
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          push: false
          load: true
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:test

      - name: 🧪 Health Check - ${{ matrix.service }}
        run: |
          echo "Starting ${{ matrix.service }} container..."
          docker run -d \
            --name test-container \
            -p 3000:3000 \
            -e INSTANCE_ID=test \
            -e DATABASE_URL="postgresql://fake:fake@localhost:5432/fake" \
            -e JWT_SECRET="test-secret-key" \
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:test

          echo "Waiting 8 seconds for container to start..."
          sleep 8

          if docker ps | grep -q test-container; then
            echo "✅ Container is running! Health check passed!"
          else
            echo "❌ Container crashed! Here are the logs:"
            docker logs test-container
            exit 1
          fi

          docker stop test-container
          docker rm test-container

      - name: 📤 Push ${{ matrix.service }} to Registry
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:latest
